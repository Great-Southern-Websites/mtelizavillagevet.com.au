---
layout: default
---
{@io.quarkiverse.roq.frontmatter.runtime.model.DocumentPage page}
{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<section class="page-banner">
  <div class="container">
    <p class="eyebrow">MEVV blog</p>
    <h1>{=page.title}</h1>
  </div>
  <div class="wave" role="presentation"></div>
</section>
<main class="section">
  <article class="container prose">
    <p class="article-meta"><time datetime="{=page.date.isoDate}">{=page.date.format('d MMMM yyyy')}</time></p>
    {#insert /}
    <p><a href="{=site.url('blog')}">&larr; All posts</a></p>
  </article>
</main>
